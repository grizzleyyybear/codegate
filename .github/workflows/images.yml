# Builds and pushes all 7 images to ghcr.io/grizzleyyybear on every push
# to main (and manually). `shared/` is COPYd into every service image, so
# there is no path filtering — a full rebuild keeps the images consistent.
#
# Note: linux/amd64 only. If you deploy on ARM (Oracle free tier, Fly ARM),
# build once locally with `docker buildx build --platform linux/arm64` and
# push, or add a second platform here (slower on private repos).
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: orchestrator, context: ., dockerfile: services/orchestrator/Dockerfile }
          - { name: retrieval, context: ., dockerfile: services/retrieval/Dockerfile }
          - { name: codegen, context: ., dockerfile: services/codegen/Dockerfile }
          - { name: validator, context: ., dockerfile: services/validator/Dockerfile }
          - { name: guardrail, context: ., dockerfile: services/guardrail/Dockerfile }
          - { name: gateway, context: ., dockerfile: services/gateway/Dockerfile }
          - { name: dashboard, context: ./dashboard, dockerfile: dashboard/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
