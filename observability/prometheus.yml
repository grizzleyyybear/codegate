global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: codegate-services
    static_configs:
      - targets:
          - gateway:8000
          - orchestrator:8001
          - retrieval:8002
          - codegen:8003
          - validator:8004
          - guardrail:8005
