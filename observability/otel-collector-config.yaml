# Receives traces from every service, exports to Prometheus (metrics) and
# a local file (traces) — swap the file exporter for Tempo/Jaeger later.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  logging:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
