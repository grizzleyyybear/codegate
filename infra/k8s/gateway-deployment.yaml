apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: codegate/gateway:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: codegate-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codegate
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
