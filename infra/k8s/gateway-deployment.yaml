# Entry point — the only service exposed to the internet (via the
# ingress or a LoadBalancer). Reads GATEWAY_API_KEY and
# GITHUB_WEBHOOK_SECRET from the secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      # uncomment for private ghcr.io packages:
      # imagePullSecrets:
      #   - { name: ghcr-pull }
      containers:
        - name: gateway
          image: ghcr.io/grizzleyyybear/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codegate
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
