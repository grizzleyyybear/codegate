# ===========================================================================
# codegate-secrets — TEMPLATE ONLY. DO NOT APPLY AS-IS.
#
# Generate a real secret before deploying:
#
#   $env:POSTGRES_PASSWORD = "a-long-random-value"
#   $env:GATEWAY_API_KEY    = "a-long-random-value"
#   $env:GITHUB_WEBHOOK_SECRET = "a-long-random-value"
#   $env:OPENROUTER_API_KEY = "sk-or-v1-..."
#   kubectl create secret generic codegate-secrets --namespace codegate \
#     --from-literal=POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD \
#     --from-literal=POSTGRES_USER=codegate \
#     --from-literal=POSTGRES_DB=codegate \
#     --from-literal=DATABASE_URL="postgresql://codegate:$env:POSTGRES_PASSWORD@postgres:5432/codegate" \
#     --from-literal=GATEWAY_API_KEY=$env:GATEWAY_API_KEY \
#     --from-literal=GITHUB_WEBHOOK_SECRET=$env:GITHUB_WEBHOOK_SECRET \
#     --from-literal=OPENROUTER_API_KEY=$env:OPENROUTER_API_KEY
#
# The placeholder values below are deliberately non-functional so that
# applying this file by accident cannot produce a working (insecure) stack.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: codegate-secrets
  namespace: codegate
type: Opaque
stringData:
  POSTGRES_DB: codegate
  POSTGRES_USER: codegate
  POSTGRES_PASSWORD: CHANGE-ME
  DATABASE_URL: postgresql://codegate:CHANGE-ME@postgres:5432/codegate
  GATEWAY_API_KEY: CHANGE-ME
  GITHUB_WEBHOOK_SECRET: CHANGE-ME
  OPENROUTER_API_KEY: CHANGE-ME
