# Port 8003. Clones repos into REPOS_ROOT=/work — emptyDir is fine for a
# demo; use a PVC shared with the gateway if you want one worker to see
# another's clones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegen
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: codegen }
  template:
    metadata:
      labels: { app: codegen }
    spec:
      containers:
        - name: codegen
          image: codegate/codegen:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8003 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codegen
  namespace: codegate
spec:
  selector: { app: codegen }
  ports: [{ port: 8003, targetPort: 8003 }]
