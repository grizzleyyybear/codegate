# Port 8004. Runs ruff/mypy/bandit/pytest against clones in /work and
# calls the LLM judge (needs OPENROUTER_API_KEY from the secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: validator }
  template:
    metadata:
      labels: { app: validator }
    spec:
      # uncomment for private ghcr.io packages:
      # imagePullSecrets:
      #   - { name: ghcr-pull }
      containers:
        - name: validator
          image: ghcr.io/grizzleyyybear/validator:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8004 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: validator
  namespace: codegate
spec:
  selector: { app: validator }
  ports: [{ port: 8004, targetPort: 8004 }]
