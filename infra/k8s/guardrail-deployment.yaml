# Port 8005 — the sensitive-path / secret-detection gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: guardrail }
  template:
    metadata:
      labels: { app: guardrail }
    spec:
      # uncomment for private ghcr.io packages:
      # imagePullSecrets:
      #   - { name: ghcr-pull }
      containers:
        - name: guardrail
          image: ghcr.io/grizzleyyybear/guardrail:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8005 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail
  namespace: codegate
spec:
  selector: { app: guardrail }
  ports: [{ port: 8005, targetPort: 8005 }]
