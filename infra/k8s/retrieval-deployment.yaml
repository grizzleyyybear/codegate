# Port 8002. Needs DATABASE_URL (secret) and a writable /work for
# chunked repos — an emptyDir is fine for a demo; swap for a PVC if
# re-indexing cost matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  namespace: codegate
spec:
  replicas: 1
  selector:
    matchLabels: { app: retrieval }
  template:
    metadata:
      labels: { app: retrieval }
    spec:
      containers:
        - name: retrieval
          image: codegate/retrieval:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8002 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: work, mountPath: /work }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval
  namespace: codegate
spec:
  selector: { app: retrieval }
  ports: [{ port: 8002, targetPort: 8002 }]
