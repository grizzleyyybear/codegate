# Same shape as gateway-deployment.yaml — port 8001.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: codegate
spec:
  replicas: 2
  selector:
    matchLabels: { app: orchestrator }
  template:
    metadata:
      labels: { app: orchestrator }
    spec:
      containers:
        - name: orchestrator
          image: codegate/orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: codegate-config }
            - secretRef: { name: codegate-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: codegate
spec:
  selector: { app: orchestrator }
  ports: [{ port: 8001, targetPort: 8001 }]
